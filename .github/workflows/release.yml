name: Release

# Yalnız sürüm etiketiyle tetiklenir: v0.1.0, v0.2.0-rc1 ...
# Dal push'u release üretmez; sürüm çıkarmak bilinçli bir hareket olmalı.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      # fail-fast KAPALI: bir platform düşünce diğerlerinin çıktısı da iptal
      # olurdu. Üç platformdan ikisi çalışıyorsa bunu görmek isteriz.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - os: macos-latest
            target: x86_64-apple-darwin
            label: macOS (Intel)
          - os: ubuntu-22.04
            target: ""
            label: Linux
          - os: windows-latest
            target: ""
            label: Windows

    steps:
      - uses: actions/checkout@v4

      - name: Sistem bağımlılıkları (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tayan-desktop/pnpm-lock.yaml

      - name: Bağımlılıklar
        working-directory: apps/tayan-desktop
        run: pnpm install --frozen-lockfile

      # UYARI: paketler İMZASIZ üretilir. macOS'ta Gatekeeper "geliştirici
      # doğrulanamadı" der ve kullanıcı sağ tık > Aç ile geçmek zorunda kalır;
      # Windows'ta SmartScreen uyarısı çıkar. İmzalama Apple Developer ($99/yıl)
      # ve bir Windows kod imzalama sertifikası ister. Öğretmenlere dağıtım
      # yapılmadan önce bu çözülmeli — aksi hâlde kurulum adımı korkutucudur.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # macOS imzalama ve noterleme.
          #
          # Sır tanımlı DEĞİLSE bu değişkenler boş gelir ve tauri-action imzasız
          # paket üretir — bugünkü davranış. Yani bu blok hiçbir şeyi bozmaz;
          # sırlar eklendiği gün imzalama kendiliğinden devreye girer.
          #
          # Kurulum adımları: docs/IMZALAMA.md
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/tayan-desktop
          tagName: ${{ github.ref_name }}
          releaseName: TAYAN ${{ github.ref_name }}
          releaseBody: |
            ## Ön sürüm — üretim için değil

            TAYAN henüz tamamlanmadı. Bilinen eksikler:

            - **Sonuç girişi arayüzü yok.** Sınav sonuçları girilemediği için
              madde analizi (güçlük, ayırt edicilik) hiçbir soruda oluşmaz.
            - Soru bankası listesi soruları dizgi olarak gösteriyor.

            ## Kurulum

            Paketler imzasız (sertifika maliyeti için bkz. docs/IMZALAMA.md).
            İşletim sistemi bir kez uyarı verir; adımlar şunlar:

            **macOS** — indirdikten sonra uygulamaya **sağ tıklayın > Aç**,
            çıkan pencerede tekrar **Aç**. Çift tıklamak çalışmaz. Yalnız ilk
            açılışta gerekir; sonrasında normal açılır.

            **Windows** — SmartScreen uyarısında **Ek bilgi > Yine de çalıştır**.

            **Linux** — uyarı çıkmaz. `.deb`, `.rpm` ya da `.AppImage` seçin.
            - Soru bankası listesi soruları dizgi olarak değil ham Typst
              kaynağı olarak gösteriyor.

            Veriler yereldir (SQLite) ve uygulama tamamen çevrimdışı çalışır.
            Denemek isteyenler için; sınıfta kullanmadan önce yedek alın.

            Değişiklikler için commit geçmişine bakınız.
          # Ön sürüm ve taslak DEĞİL: etiket atıldığında doğrudan yayımlanır.
          # Ön sürüm işareti, bunun denenmek için olduğunu listede görünür kılar.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
