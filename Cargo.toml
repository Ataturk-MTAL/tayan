[workspace]
resolver = "2"
members = [
    "crates/tayan-macros",
    "crates/tayan-core",
    "crates/tayan-compiler",
    "crates/tayan-db",
    "apps/tayan-desktop/src-tauri",
]

[workspace.package]
version     = "0.1.0"
edition     = "2024"
authors     = ["Hakan Gülen"]
license     = "Apache-2.0"

[workspace.dependencies]
# Shared serialization
serde        = { version = "1.0.229",   features = ["derive"] }
serde_json   = "1.0.151"
toml         = "1.1.5+spec-1.1.0"

# IDs & time
uuid         = { version = "1.26.0",   features = ["v4", "serde"] }
chrono       = { version = "0.4.45", features = ["serde"] }

# Error handling
thiserror    = "2.0.20"
anyhow       = "1.0.104"

# Async runtime
tokio        = { version = "1.53.1",   features = ["full"] }

# Proc macro helpers (tayan-macros only)
syn          = { version = "3.0.4",   features = ["full", "extra-traits"] }
quote        = "1.0.47"
proc-macro2  = "1.0.107"

# Database
sqlx         = { version = "0.9.0", features = [
    "sqlite", "runtime-tokio", "macros",
    "chrono", "uuid",
] }

# Tauri
tauri        = { version = "2.11.5",   features = ["protocol-asset"] }
tauri-build  = { version = "2.6.3",   features = [] }


# Internal crates
tayan-macros   = { path = "crates/tayan-macros" }
tayan-core     = { path = "crates/tayan-core" }
tayan-compiler = { path = "crates/tayan-compiler" }
tayan-db       = { path = "crates/tayan-db" }

[profile.release]
opt-level = 3
lto       = true
strip     = true
